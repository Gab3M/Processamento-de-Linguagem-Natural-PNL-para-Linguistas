<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- eixo sintagmático -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <line x1="70" y1="90" x2="660" y2="90" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="70" font-size="17" font-weight="bold" fill="#2c3e50">Eixo sintagmático — combinação</text>

  <line x1="70" y1="110" x2="70" y2="380" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="255" font-size="17" font-weight="bold" fill="#c0392b" transform="rotate(-90 30 255)" text-anchor="middle">Eixo paradigmático — seleção</text>

  <!-- estrutura sintagmática -->
  <g font-size="18" fill="#2c3e50">
    <rect x="105" y="115" width="105" height="38" rx="6" fill="#eaf2f8" stroke="#2c3e50"/>
    <text x="157" y="140" text-anchor="middle">Helsinque</text>

    <rect x="225" y="115" width="55" height="38" rx="6" fill="#f4f6f7" stroke="#95a5a6"/>
    <text x="252" y="140" text-anchor="middle">é</text>

    <rect x="295" y="115" width="115" height="38" rx="6" fill="#f4f6f7" stroke="#95a5a6"/>
    <text x="352" y="140" text-anchor="middle">a capital</text>

    <rect x="425" y="115" width="55" height="38" rx="6" fill="#f4f6f7" stroke="#95a5a6"/>
    <text x="452" y="140" text-anchor="middle">da</text>

    <rect x="495" y="115" width="120" height="38" rx="6" fill="#eaf2f8" stroke="#2c3e50"/>
    <text x="555" y="140" text-anchor="middle">Finlândia</text>
  </g>

  <!-- alternativas paradigmáticas -->
  <g font-size="17" fill="#c0392b">
    <line x1="157" y1="155" x2="157" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <rect x="105" y="175" width="105" height="34" rx="6" fill="#fdedec" stroke="#c0392b"/>
    <text x="157" y="198" text-anchor="middle">Talin</text>
    <rect x="105" y="225" width="105" height="34" rx="6" fill="#fdedec" stroke="#c0392b"/>
    <text x="157" y="248" text-anchor="middle">Estocolmo</text>
    <rect x="105" y="275" width="105" height="34" rx="6" fill="#fdedec" stroke="#c0392b"/>
    <text x="157" y="298" text-anchor="middle">Brasília</text>
    <text x="157" y="335" text-anchor="middle" font-size="20">⋮</text>

    <line x1="555" y1="155" x2="555" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <rect x="495" y="175" width="120" height="34" rx="6" fill="#fdedec" stroke="#c0392b"/>
    <text x="555" y="198" text-anchor="middle">Estônia</text>
    <rect x="495" y="225" width="120" height="34" rx="6" fill="#fdedec" stroke="#c0392b"/>
    <text x="555" y="248" text-anchor="middle">Suécia</text>
    <rect x="495" y="275" width="120" height="34" rx="6" fill="#fdedec" stroke="#c0392b"/>
    <text x="555" y="298" text-anchor="middle">Brasil</text>
    <text x="555" y="335" text-anchor="middle" font-size="20">⋮</text>
  </g>

  <text x="360" y="400" text-anchor="middle" font-size="14" fill="#566573">As escolhas paradigmáticas (verticais) combinam-se em estruturas sintagmáticas (horizontais).</text>
</svg>
